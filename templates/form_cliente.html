<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Modifica' if cliente else 'Nuovo' }} Cliente</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { margin-top: 0; color: #1e293b; font-size: 22px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #64748b; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        .actions { margin-top: 30px; display: flex; justify-content: space-between; gap: 15px; }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 15px; transition: all 0.2s; text-align: center; flex: 1; }
        .btn-save { background: #6366f1; color: white; }
        .btn-save:hover { background: #4f46e5; }
        .btn-cancel { background: #f1f5f9; color: #475569; }
        .btn-cancel:hover { background: #e2e8f0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>{{ 'Modifica' if cliente else 'Nuovo' }} Cliente</h2>
        <form action="/anagrafica/salva" method="POST">
            {% if cliente %}
            <input type="hidden" name="id" value="{{ cliente.id }}">
            {% endif %}
            
            <div class="form-group">
                <label>Nome e Cognome</label>
                <input type="text" name="nome" value="{{ cliente.nome if cliente else '' }}" placeholder="es. Mario Rossi" required>
            </div>
            
            <div class="form-group">
                <label>Telefono</label>
                <input type="text" name="telefono" value="{{ cliente.telefono if cliente else '' }}" placeholder="es. 3331234567">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ cliente.email if cliente else '' }}" placeholder="es. nome@esempio.com">
            </div>
            
            <div class="form-group">
                <label>Indirizzo Predefinito</label>
                <input type="text" name="indirizzo" value="{{ cliente.indirizzo_predefinito if cliente else '' }}" placeholder="Via, Città, N. Civico">
            </div>
            
            <div class="actions">
                <a href="/anagrafica" class="btn btn-cancel">Annulla</a>
                <button type="submit" class="btn btn-save">
                    {{ 'Aggiorna Cliente' if cliente else 'Salva Cliente' }}
                </button>
            </div>
        </form>
    </div>
</body>
</html>
